seed: 7
data:
  val_size: 0.1
  subsample: null
  n_fusion: null
  n_human: 40000
  n_ai: 25000
train:
  epochs: 2
  batch_size: 16
  lr: 2.0e-05
  weight_decay: 0.01
  warmup: 0.06
  eval_batch_size: 64
  monitor_size: 3000
wandb: false
family: tagger
description: 'Second token tagger: all labelled fusion texts, more human and ai texts,
  another seed'
model:
  arch: xlm-roberta-base
  max_len: 512
  num_labels: 2
features:
  smooth_window: 32
inputs:
  first_tagger: tagger_xlmr
name: tagger_xlmr2
